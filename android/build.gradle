plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' apply false
}

// Flutter keeps the legacy Kotlin plugin enabled during its AGP 9 migration by
// setting android.builtInKotlin=false in the consuming application's properties.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlinDisabled = project.hasProperty('android.builtInKotlin') &&
        project.property('android.builtInKotlin').toString() == 'false'
def appliesLegacyKotlin = agpMajor < 9 || builtInKotlinDisabled
if (appliesLegacyKotlin) {
    apply plugin: 'kotlin-android'
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

group 'com.prongbang.screen_protector'

android {
    namespace 'com.prongbang.screen_protector'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
        targetSdk 36
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

if (appliesLegacyKotlin) {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
} else {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}
